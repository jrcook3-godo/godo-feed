    <script>/* Opened from the iPhone Home Screen: iOS reports the page as shorter than the screen (by the height of the
         clock/battery bar), which left an empty band under the bottom tabs. Size the app to the whole screen instead. */
      if (navigator.standalone === true && /iPhone|iPod/.test(navigator.userAgent)) {
        var fit = function () {
          var land = window.matchMedia('(orientation: landscape)').matches;
          var h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
          // Never shrink below what the page reports; only fill the missing strip.
          h = Math.max(h, window.innerHeight);
          document.documentElement.style.setProperty('--app-height', h + 'px');
        };
        fit();
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
        var st = document.createElement('style');
        st.textContent = 'html,body,#root{height:var(--app-height,100%) !important;}';
        document.head.appendChild(st);
      }
    </script>
