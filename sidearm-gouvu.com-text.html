<table class="sidearm-table">
                                    <caption class="a11y-hide">Score By Period</caption>
                                    <thead>
                                        <tr>
                                            <th scope="col" class="text-hide">Team</th>
                                            <!-- ko foreach: away.score_by_periods -->
                                            <th scope="col" class="text-center" data-bind="text: $root.DisplayPeriod(period)">
                                                Period</th>
                                            <!-- /ko -->
                                            <th scope="col" class="text-center emphasize">F</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <th class="hide-on-medium-down" scope="row" data-bind="text: away.name, css: { 'winner': parseInt(away.score) > parseInt(home.score) }">
                                                Away Team</th>
                                            <th class="hide-on-large" scope="row" data-bind="text: away.id, css: { 'winner': parseInt(away.score) > parseInt(home.score) }">
                                                Away Team</th>
                                            <!-- ko foreach: away.score_by_periods -->
                                            <td class="text-center" data-bind="text: score"></td>
                                            <!-- /ko -->
                                            <td class="text-center emphasize" data-bind="text: away.score">Away Team Final Score
                                            </td>
                                        </tr>
                                        <tr>
                                            <th scope="row" class="hide-on-medium-down" data-bind="text: home.name, css: { 'winner': parseInt(home.score) > parseInt(away.score) }">
                                                Home Team</th>
                                            <th scope="row" class="hide-on-large" data-bind="text: home.id, css: { 'winner': parseInt(home.score) > parseInt(away.score) }">
                                                Home Team</th>
                                            <!-- ko foreach: home.score_by_periods -->
                                            <td class="text-center" data-bind="text: score"></td>
                                            <!-- /ko -->
                                            <td class="text-center emphasize" data-bind="text: home.score">Home Team Final Score
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
